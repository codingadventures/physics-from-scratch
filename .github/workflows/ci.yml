name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  starter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: starter/package-lock.json
      - run: npm ci
      - run: npm run doctor
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Exercise tests fail by design until a learner solves them. CI runs the
      # given code's tests, then checks that every exercise test fails only on a TODO stub.
      - run: npm run test:given
      - run: node scripts/progress.mjs --expect-stubs
      - run: npm run build
