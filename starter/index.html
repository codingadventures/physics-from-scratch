<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Physics From Scratch demos</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #26251f;
        --muted: #6f6d64;
        --bg: #f4f3ee;
        --accent: #2563c9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8e6df;
          --muted: #a3a198;
          --bg: #101012;
          --accent: #6ea0f5;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      #app {
        max-width: 820px;
        margin: 0 auto;
        padding: 16px;
      }
      nav {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      nav a {
        padding: 4px 10px;
        border-radius: 6px;
        color: var(--muted);
        text-decoration: none;
      }
      nav a[aria-current] {
        background: var(--accent);
        color: white;
      }
      h1 {
        font-size: 1.4rem;
        margin: 16px 0 4px;
      }
      p {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .todo {
        white-space: pre-wrap;
        padding: 16px;
        border-radius: 8px;
        border: 1px dashed var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/demos/main.ts"></script>
  </body>
</html>
